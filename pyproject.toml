[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "scikit-llm"
dynamic = ["version"]
dependencies = [
  "scikit-learn>=1.6",
  "numpy>=1.24",
  "openai>=1.50",
  "fnnx[extras]>=0.0.12",
  "tqdm>=4.60",
]
authors = [
  { name="Oleh Kostromin", email="kostromin97@gmail.com" },
  { name="Iryna Kondrashchenko", email="iryna230520@gmail.com" },
]
description = "Scikit-LLM: Seamlessly integrate powerful language models like ChatGPT into scikit-learn for enhanced text analysis tasks."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
google = ["google-genai>=1.0"]
litellm = ["litellm>=1.60"]
all = ["scikit-llm[anthropic,google,litellm]"]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.11"]

[tool.setuptools.dynamic]
version = { attr = "skllm.__version__" }

[tool.setuptools.packages.find]
include = ["skllm*"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    "W",
    # pyflakes
    "F",
    # isort
    "I",
    # flake8-bugbear
    "B",
    # flake8-bandit
    "S",
    # flake8-simplify
    "SIM",
    # pyupgrade
    "UP",
    # pep8-naming
    "N",
    # ruff-specific
    "RUF",
]
# E501 is left to the formatter; N803/N806 clash with sklearn's `X`/`y` convention.
ignore = ["E501", "N803", "N806"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["S101"]

[tool.mypy]
files = ["skllm", "tests"]
# Not the 3.10 floor: numpy's bundled stubs use PEP 695 `type` statements, which
# mypy refuses to parse below 3.12. Ruff's py310 target guards the actual floor.
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
